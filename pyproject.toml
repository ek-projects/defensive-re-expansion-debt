[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "defensive-re-expansion-debt"
version = "0.2.0"
description = "Defensive Re-Expansion Debt: an interpretable football tracking metric for lateral recovery after penetration"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{name = "EK Projects"}]
keywords = ["football", "soccer", "tracking-data", "sports-analytics", "defensive-shape"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
analysis = ["pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8"]
video = ["pillow>=10"]
dev = ["pytest>=8", "pandas>=2.1", "scipy>=1.11", "matplotlib>=3.8", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/ek-projects/defensive-re-expansion-debt"
Repository = "https://github.com/ek-projects/defensive-re-expansion-debt"

[tool.setuptools.packages.find]
where = ["src"]
